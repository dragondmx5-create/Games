<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UNDRAL Core 3D</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #111; font-family: system-ui, sans-serif; }
      #app { width: 100%; height: 100%; }
      #hud { position: fixed; left: 16px; top: 16px; z-index: 10; color: white; background: rgba(0,0,0,.55); padding: 10px 12px; border-radius: 8px; line-height: 1.45; }
      #message { margin-top: 6px; color: #ffd86b; min-height: 1.3em; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <div>Move: WASD / Arrow keys</div>
      <div>Attack: Space</div>
      <div id="stats"></div>
      <div id="message"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
